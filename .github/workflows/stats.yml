# Download counts for the listed mods, every 6 hours (tools/stats.py): the download count of
# each mod's .azmod release assets, over all its versions, into stats.json. Decks fetch the
# file with the list and show the counts in Community Mods. The file is committed only when a
# number changed.
name: stats

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: false

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Count the downloads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/stats.py azmods-repos.json stats.json

      - name: Check the file
        run: test ! -f stats.json || python3 tools/check.py --stats stats.json

      - name: Commit a change
        run: |
          git add stats.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no count changed"
            exit 0
          fi
          git config user.name "Kyle Hosman"
          git config user.email "125510729+Kyle-Hosman@users.noreply.github.com"
          git commit -m "Download counts"
          git push
