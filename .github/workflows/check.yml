# Checks the community list on every pull request, on every push to main, and once a
# week (so a listed repository that breaks later is noticed):
#   - azmods-repos.json follows its schema (tools/check.py)
#   - every listed repository's mods carry MAJOR.MINOR.PATCH versions (tools/check.py)
#   - every listed repository has a valid azmods-repo.json on its default branch
#   - every package downloads, matches its sha256 and size, and passes azmod-pack
#     validate (the same checks a deck runs before installing)
#   - every mod's source URL is publicly reachable
#   - stats.json, when there is one, follows its schema (tools/check.py --stats)
name: check

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # These need nothing but Python, so they always run: the list's schema, then each
      # listed repository's azmods-repo.json (every version and min_core is MAJOR.MINOR.PATCH,
      # numbers only, the only form a deck compares).
      - name: Check the tools' own tests
        run: python3 -m unittest discover -s tests

      - name: Check the list's schema and every listed repository's versions
        run: python3 tools/check.py azmods-repos.json --fetch

      - name: Check the download counts' schema
        run: test ! -f stats.json || python3 tools/check.py --stats stats.json

      # The full check uses the SDK's azmod-pack, at the SDK release decks are built against.
      - uses: actions/checkout@v4
        with:
          repository: Kyle-Hosman/az-mods-sdk
          ref: v1.2.3
          path: .azmod-sdk

      - name: Check every listed repository and package
        run: python3 .azmod-sdk/tools/azmod-pack list check azmods-repos.json --download
